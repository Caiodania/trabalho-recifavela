[theme]
base = "light"
primaryColor = "#1F6F50"
backgroundColor = "#FBF8F3"
secondaryBackgroundColor = "#F2EDE4"
textColor = "#1E2A25"
borderColor = "#E3DCD0"
linkColor = "#1F6F50"
baseRadius = "0.75rem"
buttonRadius = "full"
showWidgetBorder = true
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Poppins:https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap, sans-serif"

[theme.sidebar]
backgroundColor = "#EEF4EF"
secondaryBackgroundColor = "#FFFFFF"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 50

[browser]
gatherUsageStats = false
